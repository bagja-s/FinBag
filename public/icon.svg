<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Subtle drop shadow for floating minimalist depth -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.06" />
    </filter>

    <!-- Premium Indigo-Blue Gradient for Wallet Body -->
    <linearGradient id="finBagBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Accent Emerald Growth Gradient -->
    <linearGradient id="emeraldGrowth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Top Handle Accent -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Background with Subtle Outer Border -->
  <rect width="512" height="512" rx="120" fill="#FFFFFF" />
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="#E2E8F0" stroke-width="4" />

  <!-- Group with Shadow -->
  <g filter="url(#cardShadow)">
    <!-- Bag Handle -->
    <path d="M196 150 V124 C196 95 219 72 248 72 H264 C293 72 316 95 316 124 V150" 
          fill="none" 
          stroke="url(#handleGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- Main Wallet / Bag Container -->
    <rect x="116" y="148" width="280" height="256" rx="44" fill="url(#finBagBody)" />

    <!-- Geometric Accent / Front Pocket Curve -->
    <path d="M116 230 C170 270 342 270 396 230 V360 C396 384 376 404 352 404 H160 C136 404 116 384 116 360 Z" 
          fill="#1E3A8A" 
          fill-opacity="0.55" />

    <!-- Modern Clean Minimalist Flap Fold -->
    <path d="M120 156 L256 250 L392 156" 
          fill="none" 
          stroke="#93C5FD" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-opacity="0.9" />

    <!-- Growth / Security Emerald Clasp Badge -->
    <circle cx="256" cy="272" r="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
    <circle cx="256" cy="272" r="22" fill="url(#emeraldGrowth)" />

    <!-- Minimalist Security / Currency Spark Icon -->
    <path d="M256 261 V283 M245 272 H267" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linecap="round" />
  </g>

  <!-- Minimalist Corner Accent Dots -->
  <circle cx="152" cy="184" r="5" fill="#60A5FA" fill-opacity="0.7" />
  <circle cx="360" cy="184" r="5" fill="#60A5FA" fill-opacity="0.7" />
</svg>
